<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Sleep Log v0.1</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--accent2:#eef2ff;--danger:#dc2626}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:#111827;color:#fff;padding:22px 18px 18px;position:sticky;top:0;z-index:5}
h1{font-size:23px;margin:0 0 4px}.sub{font-size:12px;color:#cbd5e1}
main{max-width:720px;margin:auto;padding:14px 14px 90px}.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;border:0;border-radius:12px;padding:11px;background:#e5e7eb;font-weight:700}.tab.active{background:#111827;color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000008}
h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px} input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:11px;background:#fff;font-size:15px}
textarea{min-height:75px;resize:vertical}.full{grid-column:1/-1}
button.primary{width:100%;border:0;background:var(--accent);color:white;border-radius:12px;padding:13px;font-weight:800;font-size:15px;margin-top:10px}
button.secondary{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.metric{font-size:26px;font-weight:800}.muted{color:var(--muted);font-size:12px}
.bar{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:7px 0}.bar>i{display:block;height:100%;background:var(--accent)}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.pill{font-size:11px;background:var(--accent2);color:#3730a3;padding:4px 8px;border-radius:99px}
.empty{text-align:center;color:var(--muted);padding:24px}.danger{color:var(--danger)}
.hidden{display:none}.note{background:#f8fafc;padding:10px;border-radius:11px;font-size:12px;color:#475569}
@media(max-width:480px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><h1>Sleep Log</h1><div class="sub">睡眠記録 v0.1 — 「寝たのに眠い」も記録する</div></header>
<main>
<div class="tabs"><button id="tabLog" class="tab active" type="button">記録</button><button id="tabHistory" class="tab" type="button">履歴</button><button id="tabAnalysis" class="tab" type="button">分析</button></div>

<section id="log">
<div class="card">
<h2>🌙 睡眠メモ</h2>
<div class="grid">
<div><label>記録日</label><input id="sleepDate" type="date"></div>
<div><label>布団に入った時刻</label><input id="bedTime" type="time"></div>
<div><label>実際に眠った時刻</label><input id="sleepTime" type="time"></div>
<div><label>最終起床時刻</label><input id="finalWake" type="time"></div>
<div><label>起きようとした時刻</label><input id="attemptWake" type="time"></div>
<div><label>二度寝</label><input id="resleep" placeholder="例：6:00〜9:00 / なし"></div>
<div><label>昼寝</label><input id="napText" placeholder="例：13:30〜17:30 / なし"></div>
<div><label>光を浴びた時刻</label><input id="lightTime" type="time"></div>
<div><label>カフェイン</label><input id="caffeineText" placeholder="例：13:00 コーヒー1杯"></div>
<div><label>活動量</label><select id="activityLevel"><option>低</option><option selected>中</option><option>高</option><option>不明</option></select></div>
<div><label>夜の眠気（0〜10）</label><input id="nightSleepiness" type="number" min="0" max="10" placeholder="任意"></div>
<div><label>起床直後の眠気（0〜10）</label><input id="wakeSleepiness" type="number" min="0" max="10" value="5"></div>
<div><label>起床直後 → 3.5時間後の眠気</label><input id="laterSleepiness" type="number" min="0" max="10" placeholder="任意"></div>
<div><label>起き上がれるまで</label><input id="getUpTime" placeholder="例：0分 / 9:15"></div>
<div><label>普通に活動できるまで</label><input id="normalTime" placeholder="例：0分 / 10:00"></div>
<div><label>「起きよう」としてから普通に動けるまで</label><input id="wakeRecovery" placeholder="例：2時間30分"></div>
<div class="full"><label>起床後の変化・きっかけ</label><textarea id="wakeNote" placeholder="例：職場からのメールが来ていないか確認したら一気に目が覚めた。"></textarea></div>
<div class="full"><label>その他メモ</label><textarea id="sleepMemo" placeholder="その日の出来事、気分、体調、寝る前のことなど自由に。"></textarea></div>
<div class="full"><label>その他メモ2</label><textarea id="sleepMemo2" placeholder="書き足したいことがあれば自由に。"></textarea></div>
</div>
<button class="primary" onclick="addSleepDiary()">この日の睡眠日誌を保存</button>
</div>

<div class="card">
<h2>🍺 飲酒</h2>
<div class="grid">
<div><label>飲酒</label><select id="alcohol"><option value="no">なし</option><option value="yes">あり</option></select></div>
<div><label>酒の種類</label><input id="alcoholType" placeholder="例：ビール"></div>
<div><label>量</label><input id="alcoholAmount" placeholder="例：1缶、350ml"></div>
<div><label>度数</label><input id="alcoholAbv" placeholder="例：8%"></div>
<div><label>飲酒開始</label><input id="alcoholStart" type="time"></div>
<div><label>飲酒終了</label><input id="alcoholEnd" type="time"></div>
</div>
</div>

<div class="card">
<h2>🏷️ タグ</h2>
<div style="display:flex;flex-wrap:wrap;gap:7px">
<label style="background:#f1f5f9;padding:7px 10px;border-radius:99px;color:#334155"><input class="tag" type="checkbox" value="外出" style="width:auto;margin-right:4px">外出</label>
<label style="background:#f1f5f9;padding:7px 10px;border-radius:99px;color:#334155"><input class="tag" type="checkbox" value="運動" style="width:auto;margin-right:4px">運動</label>
<label style="background:#f1f5f9;padding:7px 10px;border-radius:99px;color:#334155"><input class="tag" type="checkbox" value="病院" style="width:auto;margin-right:4px">病院</label>
<label style="background:#f1f5f9;padding:7px 10px;border-radius:99px;color:#334155"><input class="tag" type="checkbox" value="ストレス" style="width:auto;margin-right:4px">ストレス</label>
<label style="background:#f1f5f9;padding:7px 10px;border-radius:99px;color:#334155"><input class="tag" type="checkbox" value="飲酒" style="width:auto;margin-right:4px">飲酒</label>
<label style="background:#f1f5f9;padding:7px 10px;border-radius:99px;color:#334155"><input class="tag" type="checkbox" value="カフェイン多め" style="width:auto;margin-right:4px">カフェイン多め</label>
<label style="background:#f1f5f9;padding:7px 10px;border-radius:99px;color:#334155"><input class="tag" type="checkbox" value="体調不良" style="width:auto;margin-right:4px">体調不良</label>
<label style="background:#f1f5f9;padding:7px 10px;border-radius:99px;color:#334155"><input class="tag" type="checkbox" value="長時間昼寝" style="width:auto;margin-right:4px">長時間昼寝</label>
<label style="background:#f1f5f9;padding:7px 10px;border-radius:99px;color:#334155"><input class="tag" type="checkbox" value="旅行" style="width:auto;margin-right:4px">旅行</label>
<label style="background:#f1f5f9;padding:7px 10px;border-radius:99px;color:#334155"><input class="tag" type="checkbox" value="仕事メール" style="width:auto;margin-right:4px">仕事メール</label>
<label style="background:#f1f5f9;padding:7px 10px;border-radius:99px;color:#334155"><input class="tag" type="checkbox" value="早朝外出の予定" style="width:auto;margin-right:4px">早朝外出の予定</label>
<label style="background:#f1f5f9;padding:7px 10px;border-radius:99px;color:#334155"><input class="tag" type="checkbox" value="その他" style="width:auto;margin-right:4px">その他</label>
</div>
</div>
<div class="note">このv0.2では、あなたが今使っている表をそのまま入力できることを優先。時刻が「不明」「だいたい」でもメモ欄で残せます。</div>
</section>

<section id="history" class="hidden">
<div class="card"><div class="row"><h2>記録一覧</h2><button class="secondary" onclick="clearAll()">全削除</button></div><div id="historyList"></div></div>
</section>

<section id="analysis" class="hidden">
<div class="card"><h2>📊 最近7日</h2><div id="stats"></div></div>
<div class="card"><h2>🔎 睡眠パターン</h2><div id="insights"></div></div>
</section>
</main>
<script>
const KEY='sleepLogV01';
let db=JSON.parse(localStorage.getItem(KEY)||'{"sleep":[],"morning":[],"day":[],"diary":[]}');
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(db));render();}
function isoLocal(d=new Date()){let z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
function showTab(id,btn){
  const section=$(id);
  if(!section)return;
  document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));
  section.classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  if(btn)btn.classList.add('active');
  render();
}
function addSleepDiary(){
  const tags=[...document.querySelectorAll('.tag:checked')].map(x=>x.value);
  const date=$('sleepDate').value || new Date().toISOString().slice(0,10);
  const d={
    id:Date.now(), date, type:'diary',
    bed:$('bedTime').value, sleep:$('sleepTime').value, finalWake:$('finalWake').value,
    attemptWake:$('attemptWake').value, resleep:$('resleep').value, nap:$('napText').value,
    light:$('lightTime').value, caffeineText:$('caffeineText').value,
    activityLevel:$('activityLevel').value, nightSleepiness:$('nightSleepiness').value,
    wakeSleepiness:$('wakeSleepiness').value, laterSleepiness:$('laterSleepiness').value,
    getUpTime:$('getUpTime').value, normalTime:$('normalTime').value, wakeRecovery:$('wakeRecovery').value,
    wakeNote:$('wakeNote').value, memo:$('sleepMemo').value, memo2:$('sleepMemo2').value, tags,
    alcohol: $('alcohol').value==='yes' ? {
      type:$('alcoholType').value, amount:$('alcoholAmount').value, abv:$('alcoholAbv').value,
      start:$('alcoholStart').value,end:$('alcoholEnd').value
    } : null
  };
  db.diary=db.diary||[]; db.diary.push(d); save();
  ['bedTime','sleepTime','finalWake','attemptWake','resleep','napText','lightTime','caffeineText','nightSleepiness','laterSleepiness','getUpTime','normalTime','wakeRecovery','wakeNote','sleepMemo','sleepMemo2','alcoholType','alcoholAmount','alcoholAbv','alcoholStart','alcoholEnd'].forEach(id=>$(id).value='');
  document.querySelectorAll('.tag').forEach(x=>x.checked=false);
}
function addMorning(){db.morning.push({id:Date.now(),date:Date.now(),sleepiness:+$('sleepiness').value,fog:+$('fog').value,energy:+$('energy').value,mood:+$('mood').value,memo:$('memo').value});save();$('memo').value=''}
function addDay(){
  const tags=[...document.querySelectorAll('.tag:checked')].map(x=>x.value);
  const drinking=$('alcohol').value==='yes';
  db.day.push({
    id:Date.now(),date:Date.now(),
    caffeine:+$('caffeine').value,activity:+$('activity').value,outing:$('outing').value,
    meds:$('meds').value, memo:$('dayMemo').value, tags,
    alcohol:drinking ? {
      type:$('alcoholType').value, ml:+$('alcoholMl').value||0,
      start:$('alcoholStart').value,end:$('alcoholEnd').value,
      intox:+$('alcoholIntox').value||0
    } : null
  });
  save();
  $('meds').value='';$('dayMemo').value='';$('alcoholMl').value='';$('alcoholStart').value='';$('alcoholEnd').value='';
  document.querySelectorAll('.tag').forEach(x=>x.checked=false);
}
function fmtMin(m){let h=Math.floor(m/60),x=Math.round(m%60);return `${h}時間${x}分`}
function render(){
 let diaries=(db.diary||[]).slice().sort((a,b)=>b.id-a.id);
 let legacy=[...db.sleep.map(x=>({...x,type:'睡眠'})),...db.morning.map(x=>({...x,type:'起床時'})),...db.day.map(x=>({...x,type:'生活'}))].sort((a,b)=>b.id-a.id);
 let list=[...diaries.map(x=>({diary:x,type:'日誌'})),...legacy];
 $('historyList').innerHTML=list.length?list.slice(0,50).map(item=>{
   if(item.type==='日誌'){
     let x=item.diary;
     return `<div class=item>
       <div class=row><b>🌙 ${esc(x.date)}</b><span class=pill>睡眠日誌</span></div>
       <div class=muted>布団 ${x.bed||'—'} / 入眠 ${x.sleep||'—'} / 最終起床 ${x.finalWake||'—'}</div>
       <div class=muted>起きようとした時刻 ${x.attemptWake||'—'} / 二度寝 ${esc(x.resleep||'なし')}</div>
       <div class=muted>眠気：直後 ${x.wakeSleepiness||'—'} / 3.5h後 ${x.laterSleepiness||'—'} / 夜 ${x.nightSleepiness||'—'}</div>
       <div class=muted>起き上がるまで ${esc(x.getUpTime||'—')} / 普通に活動 ${esc(x.normalTime||'—')}</div>
       ${x.nap?`<div class=muted>昼寝：${esc(x.nap)}</div>`:''}
       ${x.caffeineText?`<div class=muted>☕ ${esc(x.caffeineText)}</div>`:''}
       ${x.light?`<div class=muted>☀️ 光：${x.light}</div>`:''}
       ${x.activityLevel?`<div class=muted>活動量：${esc(x.activityLevel)}</div>`:''}
       ${x.alcohol?`<div class=muted>🍺 ${esc(x.alcohol.type||'酒')} ${esc(x.alcohol.amount||'')} ${esc(x.alcohol.abv||'')} / ${x.alcohol.start||'—'}〜${x.alcohol.end||'—'}</div>`:''}
       ${x.tags?.length?`<div style="margin-top:5px">${x.tags.map(t=>`<span class=pill style="margin-right:4px">${esc(t)}</span>`).join('')}</div>`:''}
       ${x.wakeNote?`<div style="margin-top:7px"><b>起床後：</b>${esc(x.wakeNote)}</div>`:''}
       ${x.memo?`<div style="margin-top:7px"><b>メモ：</b>${esc(x.memo)}</div>`:''}
       ${x.memo2?`<div style="margin-top:5px"><b>メモ2：</b>${esc(x.memo2)}</div>`:''}
     </div>`;
   }
   let x=item;
   if(item.type==='睡眠')return `<div class=item><div class=row><b>${x.kind==='nap'?'💤 昼寝':'🌙 夜間睡眠'}</b><span class=pill>${fmtMin(x.mins)}</span></div><div class=muted>${new Date(x.s).toLocaleString('ja-JP')} → ${new Date(x.e).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})} / ${x.awake}</div></div>`;
   if(item.type==='起床時')return `<div class=item><b>🧠 起床時</b><div class=muted>眠気 ${x.sleepiness}/10　頭の重さ ${x.fog}/10　体力 ${x.energy}/10　気分 ${x.mood}/10</div>${x.memo?`<div>${esc(x.memo)}</div>`:''}</div>`;
   return `<div class=item><b>☕ 生活</b><div class=muted>カフェイン ${x.caffeine}杯 / 活動 ${x.activity}/10 / 外出 ${x.outing}${x.meds?' / 服薬：'+esc(x.meds):''}</div>${x.memo?`<div>${esc(x.memo)}</div>`:''}</div>`;
 }).join(''):'<div class=empty>まだ記録がありません。</div>';
 renderStats();
}
function renderStats(){
 let since=Date.now()-7*86400000,s=db.sleep.filter(x=>new Date(x.e).getTime()>=since);
 let night=s.filter(x=>x.kind==='night'),nap=s.filter(x=>x.kind==='nap');
 let total=s.reduce((a,x)=>a+x.mins,0), nt=night.reduce((a,x)=>a+x.mins,0), np=nap.reduce((a,x)=>a+x.mins,0);
 let m=db.morning.filter(x=>x.id>=since), avg=(arr,k)=>arr.length?(arr.reduce((a,x)=>a+x[k],0)/arr.length).toFixed(1):'—';
 $('stats').innerHTML=`<div class=grid>
 <div><div class=muted>総睡眠</div><div class=metric>${fmtMin(total)}</div></div>
 <div><div class=muted>夜間睡眠</div><div class=metric>${fmtMin(nt)}</div></div>
 <div><div class=muted>昼寝</div><div class=metric>${fmtMin(np)}</div></div>
 <div><div class=muted>記録日数</div><div class=metric>${m.length}</div></div>
 </div>
 <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
 <div>平均眠気 <b>${avg(m,'sleepiness')}/10</b><div class=bar><i style="width:${(+avg(m,'sleepiness')||0)*10}%"></i></div></div>
 <div>平均頭の重さ <b>${avg(m,'fog')}/10</b><div class=bar><i style="width:${(+avg(m,'fog')||0)*10}%"></i></div></div>
 <div>平均体力 <b>${avg(m,'energy')}/10</b><div class=bar><i style="width:${(+avg(m,'energy')||0)*10}%"></i></div></div>`;
 let insights=[];
 let recentDays=db.day.filter(x=>x.id>=since);
 let drinkDays=recentDays.filter(x=>x.alcohol);
 let tagCounts={}; recentDays.flatMap(x=>x.tags||[]).forEach(t=>tagCounts[t]=(tagCounts[t]||0)+1);
 if(np>180)insights.push(`最近7日で昼寝は合計 <b>${fmtMin(np)}</b>。夜間睡眠と分けて追跡できます。`);
 if(drinkDays.length)insights.push(`飲酒を記録した日は <b>${drinkDays.length}日</b>。今後、飲酒あり/なしで翌日の眠気を比較できるようにできます。`);
 let topTags=Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).slice(0,3);
 if(topTags.length)insights.push(`最近よく付いたタグ：${topTags.map(([t,n])=>`<b>${esc(t)}</b> ${n}回`).join('、')}`);
 if(total>7*12*60)insights.push('睡眠総量がかなり多い週です。記録の正確さを確認しつつ、眠気・体力との関係を見ていく設計です。');
 if(m.length>=2){let a=m.reduce((x,y)=>x+y.sleepiness,0)/m.length,e=m.reduce((x,y)=>x+y.energy,0)/m.length;if(a>=7&&e<=4)insights.push('「眠気が強い＋体力が低い」日が多め。睡眠時間だけでなく起床後の状態も記録する価値があります。')}
 if(!insights.length)insights.push('もう少し記録がたまると、睡眠時間と日中状態のパターンを見つけやすくなります。');
 $('insights').innerHTML=insights.map(x=>`<p>${x}</p>`).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clearAll(){if(confirm('すべての記録を削除しますか？')){db={sleep:[],morning:[],day:[],diary:[]};save()}}
if($('sleepDate') && !$('sleepDate').value) $('sleepDate').value=new Date().toISOString().slice(0,10);
// タブはonclick属性に頼らず、JavaScriptから明示的に接続する
function activateTab(id, btnId){
  const section = $(id);
  if(!section) return;
  document.querySelectorAll('main>section').forEach(function(x){
    x.classList.add('hidden');
  });
  section.classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(function(x){
    x.classList.remove('active');
  });
  const btn = $(btnId);
  if(btn) btn.classList.add('active');
  render();
}

document.addEventListener('DOMContentLoaded', function(){
  const logBtn = $('tabLog');
  const historyBtn = $('tabHistory');
  const analysisBtn = $('tabAnalysis');
  if(logBtn) logBtn.addEventListener('click', function(){ activateTab('log','tabLog'); });
  if(historyBtn) historyBtn.addEventListener('click', function(){ activateTab('history','tabHistory'); });
  if(analysisBtn) analysisBtn.addEventListener('click', function(){ activateTab('analysis','tabAnalysis'); });
});

render();
</script>
</body></html>
