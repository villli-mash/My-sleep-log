<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleep Log v0.3</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    background: #f5f5f5;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
      "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }

  header {
    background: white;
    padding: 20px 16px 14px;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    margin: 0;
    font-size: 22px;
  }

  header p {
    margin: 4px 0 0;
    color: #666;
    font-size: 13px;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 14px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }

  .tab {
    flex: 1;
    border: 1px solid #ccc;
    background: white;
    padding: 10px 6px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }

  .tab.active {
    background: #222;
    color: white;
  }

  section {
    margin-bottom: 20px;
  }

  .card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .card h2 {
    font-size: 17px;
    margin: 0 0 12px;
  }

  .field {
    margin-bottom: 14px;
  }

  .field label {
    display: block;
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 5px;
  }

  .field small {
    display: block;
    color: #777;
    font-size: 12px;
    margin-top: 3px;
  }

  input,
  select,
  textarea {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 9px;
    padding: 10px;
    font-size: 16px;
    background: white;
  }

  textarea {
    min-height: 80px;
    resize: vertical;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .three {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  button {
    border: none;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 15px;
    cursor: pointer;
  }

  .primary {
    width: 100%;
    background: #222;
    color: white;
    margin-top: 8px;
  }

  .secondary {
    background: #eee;
    color: #222;
  }

  .danger {
    background: #f3dddd;
    color: #8b0000;
  }

  .editBtn {
    background: #e9eef7;
    color: #234;
  }

  .hidden {
    display: none;
  }

  .record {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 10px;
    background: white;
  }

  .record-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
  }

  .record-date {
    font-weight: 700;
    font-size: 16px;
  }

  .record-actions {
    display: flex;
    gap: 6px;
  }

  .record-actions button {
    padding: 6px 9px;
    font-size: 12px;
  }

  .record-body {
    margin-top: 10px;
    font-size: 13px;
  }

  .record-row {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }

  .record-label {
    color: #666;
    min-width: 100px;
  }

  .tag {
    display: inline-block;
    background: #eee;
    border-radius: 20px;
    padding: 2px 8px;
    margin: 2px;
    font-size: 12px;
  }

  .metric {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 8px;
    background: #fafafa;
  }

  .metric strong {
    font-size: 20px;
  }

  .insight {
    border-left: 4px solid #999;
    padding: 8px 10px;
    margin: 8px 0;
    background: #fafafa;
    font-size: 13px;
  }

  .notice {
    background: #fff8df;
    border: 1px solid #eadca7;
    border-radius: 10px;
    padding: 10px;
    font-size: 13px;
    margin-bottom: 12px;
  }

  .safeNotice {
    background: #eef7ee;
    border: 1px solid #c9dfc9;
    border-radius: 10px;
    padding: 10px;
    font-size: 13px;
    margin-bottom: 12px;
  }

  .radio-group {
    display: flex;
    gap: 8px;
  }

  .radio-option {
    flex: 1;
  }

  .radio-option input {
    display: none;
  }

  .radio-option label {
    display: block;
    text-align: center;
    padding: 9px 5px;
    border: 1px solid #ccc;
    border-radius: 9px;
    background: white;
    cursor: pointer;
    font-weight: normal;
  }

  .radio-option input:checked + label {
    background: #222;
    color: white;
    border-color: #222;
  }

  .backupInfo {
    font-size: 12px;
    color: #666;
    margin-top: 10px;
  }

  @media (max-width: 500px) {
    .row {
      grid-template-columns: 1fr;
    }

    .three {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .record-header {
      flex-direction: column;
    }
  }
</style>
</head>

<body>

<header>
  <h1>Sleep Log</h1>
  <p>睡眠記録 v0.3 — 「寝たのに眠い」も記録する</p>
</header>

<main>

  <div class="tabs">
    <button class="tab active" id="tabLog">記録</button>
    <button class="tab" id="tabHistory">履歴</button>
    <button class="tab" id="tabAnalysis">分析</button>

  <!-- =========================
       記録
  ========================== -->

  <section id="log">

    <div class="notice" id="editNotice" style="display:none;">

    <div class="card">

      <div class="field">
        <label for="wakeSleepiness">起床直後の眠気</label>
        <select id="wakeSleepiness">
          <option value="">選択</option>
          <option value="0">0 — 眠くない</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10 — 非常に眠い</option>
        </select>
      </div>

      <div class="field">
        <label for="laterSleepiness">起床後しばらくしてからの眠気</label>
        <select id="laterSleepiness">
          <option value="">選択</option>
          <option value="0">0 — 眠くない</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10 — 非常に眠い</option>
        </select>
      </div>

      <div class="row">

        <div class="field">
          <label for="getUpTime">ベッドから出た時刻</label>
          <input type="time" id="getUpTime">

        <div class="field">
          <label for="normalTime">通常の活動に戻れた時刻</label>

      <div class="field">

        <select id="wakeRecovery">

          <option value="かなり回復">かなり回復</option>
          <option value="まあまあ回復">まあまあ回復</option>
          <option value="普通">普通</option>
          <option value="あまり回復していない">あまり回復していない</option>
          <option value="全然回復していない">全然回復していない</option>

    </div>


    <div class="card">

      <h2>光・カフェイン・活動</h2>

      <div class="field">
        <label for="lightTime">朝の光を浴びた時刻・時間</label>
        <input type="text" id="lightTime"

      <div class="field">
        <label for="caffeineText">カフェイン</label>

      </div>

      <div class="field">
        <label for="activityLevel">活動量</label>
        <select id="activityLevel">
          <option value="">選択</option>
          <option value="少ない">少ない</option>

          <option value="多い">多い</option>

      </div>

      <div class="field">
        <label>身体的負荷</label>

        <div class="radio-group">

          <div class="radio-option">
            <input type="radio" name="physicalLoad"
                   id="physicalSmall" value="小">

          </div>

          <div class="radio-option">
            <input type="radio" name="physicalLoad"
                   id="physicalMedium" value="中">
            <label for="physicalMedium">中</label>
          </div>

          <div class="radio-option">

                   id="physicalLarge" value="大">

      </div>

      <div class="field">
        <label>精神的負荷</label>

        <div class="radio-group">

          <div class="radio-option">
            <input type="radio" name="mentalLoad"
                   id="mentalSmall" value="小">
            <label for="mentalSmall">小</label>
          </div>

          <div class="radio-option">
            <input type="radio" name="mentalLoad"
                   id="mentalMedium" value="中">

          </div>

          <div class="radio-option">

            <label for="mentalLarge">大</label>

    <div class="card">

      <div class="field">

  <!-- =========================
       履歴
  ========================== -->

  ========================== -->

<script>

const KEY = 'sleepLogV01';

const AUTO_BACKUP_KEY = 'sleepLogV01_autoBackup';

const SCHEMA_VERSION = 1;


/* =========================
   データ読み込み
========================= */

function createEmptyDB() {

  return {
    sleep: [],
    morning: [],
    day: [],
    diary: []
  };

}


function loadDB() {

  const raw = localStorage.getItem(KEY);

  if (!raw) {
    return createEmptyDB();
  }

  try {

    const parsed = JSON.parse(raw);

    if (!parsed || typeof parsed !== 'object') {
      return createEmptyDB();
    }

    if (!Array.isArray(parsed.sleep)) {
      parsed.sleep = [];
    }

    if (!Array.isArray(parsed.morning)) {
      parsed.morning = [];
    }

    if (!Array.isArray(parsed.day)) {
      parsed.day = [];
    }

    if (!Array.isArray(parsed.diary)) {
      parsed.diary = [];
    }

    return parsed;

  } catch (error) {

    alert(
      '保存されているデータを読み込めませんでした。'
    );

    return createEmptyDB();

  }

}


let db = loadDB();

let editingId = null;


const $ = id => document.getElementById(id);


/* =========================
   基本保存
========================= */

function saveDB() {

  localStorage.setItem(
    KEY,
    JSON.stringify(db)
  );

}


/* =========================
   変更前の自動バックアップ
========================= */

function backupBeforeChange() {

  try {

    const current = localStorage.getItem(KEY);

    if (current) {

      localStorage.setItem(
        AUTO_BACKUP_KEY,
        JSON.stringify({
          savedAt: new Date().toISOString(),
          data: JSON.parse(current)
        })
      );

    }

  } catch (error) {

    console.warn(
      '自動バックアップに失敗しました。',
      error
    );

  }

}


/* =========================
   HTMLエスケープ
========================= */

function esc(value) {

  if (value === null || value === undefined) {
    return '';
  }

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* =========================
   ID
========================= */

function makeId() {

  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);

}


/* =========================
   今日の日付
========================= */

function todayString() {

  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');

  return `${y}-${m}-${day}`;

}


if (!$('sleepDate').value) {
  $('sleepDate').value = todayString();
}


/* =========================
   ラジオボタン
========================= */

function getRadio(name) {

  const checked =
    document.querySelector(
      `input[name="${name}"]:checked`
    );

  return checked ? checked.value : '';

}


function setRadio(name, value) {

  document.querySelectorAll(
    `input[name="${name}"]`
  ).forEach(input => {

    input.checked =
      input.value === value;

  });

}


/* =========================
   タグ
========================= */

function getTags() {

  return Array.from(
    document.querySelectorAll(
      'input[name="tag"]:checked'
    )
  ).map(x => x.value);

}


function setTags(tags) {

  document.querySelectorAll(
    'input[name="tag"]'
  ).forEach(input => {

    input.checked =
      Array.isArray(tags) &&
      tags.includes(input.value);

  });

}


/* =========================
   フォームデータ取得
========================= */

function getFormData() {

  return {

    sleepDate: $('sleepDate').value,

    bedTime: $('bedTime').value,
    sleepTime: $('sleepTime').value,
    finalWake: $('finalWake').value,
    attemptWake: $('attemptWake').value,

    resleep: $('resleep').value,
    napText: $('napText').value,

    lightTime: $('lightTime').value,
    caffeineText: $('caffeineText').value,

    activityLevel: $('activityLevel').value,

    physicalLoad:
      getRadio('physicalLoad'),

    mentalLoad:
      getRadio('mentalLoad'),

    nightSleepiness:
      $('nightSleepiness').value,

    wakeSleepiness:
      $('wakeSleepiness').value,

    laterSleepiness:
      $('laterSleepiness').value,

    getUpTime:
      $('getUpTime').value,

    normalTime:
      $('normalTime').value,

    wakeRecovery:
      $('wakeRecovery').value,

    wakeNote:
      $('wakeNote').value,

    sleepMemo:
      $('sleepMemo').value,

    sleepMemo2:
      $('sleepMemo2').value,

    medTime:
      $('medTime').value,

    alcohol:
      $('alcohol').value,

    alcoholType:
      $('alcoholType').value,

    alcoholAmount:
      $('alcoholAmount').value,

    alcoholAbv:
      $('alcoholAbv').value,

    alcoholStart:
      $('alcoholStart').value,

    alcoholEnd:
      $('alcoholEnd').value,

    tags:
      getTags()

  };

}


/* =========================
   フォームへデータを入れる

/* =========================
   時刻計算
========================= */

function timeToMinutes(value) {

  if (
    !value ||
    !/^\d{1,2}:\d{2}$/.test(value)
  ) {
    return null;
  }

  const parts =
    value.split(':');

  return (
    Number(parts[0]) * 60 +
    Number(parts[1])
  );

}


function durationMinutes(
  start,
  end
) {

  let s =
    timeToMinutes(start);

  let e =
    timeToMinutes(end);

  if (
    s === null ||
    e === null
  ) {
    return null;
  }

  if (e < s) {
    e += 24 * 60;
  }

  return e - s;

}


function formatDuration(minutes) {

  if (
    minutes === null ||
    minutes === undefined ||
    isNaN(minutes)
  ) {
    return '—';
  }

  const h =
    Math.floor(minutes / 60);

  const m =
    Math.round(minutes % 60);

  if (h === 0) {
    return `${m}分`;
  }

  return `${h}時間${m}分`;

}


/* =========================
   睡眠時間
========================= */

function getSleepMinutes(item) {

  return durationMinutes(
    item.sleepTime,
    item.finalWake
  );

}


/* =========================
   平均
========================= */

function average(values) {

  const nums =
    values
      .map(Number)
      .filter(
        x => !isNaN(x)
      );

  if (!nums.length) {
    return null;
  }

  return nums.reduce(
    (a, b) => a + b,
    0
  ) / nums.length;

}

function renderStats() {

  const stats =
    $('stats');

  const insights =
    $('insights');

  const records =
    [...db.diary]
      .filter(
        x => x.sleepDate
      )
      .sort(
        (a, b) =>
          String(a.sleepDate)
            .localeCompare(
              String(b.sleepDate)
            )
      );


  if (!records.length) {

    stats.innerHTML =
      '<p>まだ分析できる記録がありません。</p>';

    insights.innerHTML =
      '';

    return;
  }


  const latestDate =
    new Date(
      records[
        records.length - 1
      ].sleepDate
    );


  const sevenDaysAgo =
    new Date(latestDate);


  sevenDaysAgo.setDate(
    sevenDaysAgo.getDate() - 6
  );


  const recent =
    records.filter(item => {

      const d =
        new Date(item.sleepDate);

      return (
        d >= sevenDaysAgo &&
        d <= latestDate
      );

    });


  const sleepValues =
    recent
      .map(getSleepMinutes)
      .filter(
        x => x !== null
      );


  const wakeSleepiness =
    average(
      recent.map(
        x => x.wakeSleepiness
      )
    );


  const laterSleepiness =
    average(
      recent.map(
        x => x.laterSleepiness

    );


  const nightSleepiness =
    average(
      recent.map(
        x => x.nightSleepiness
      )
    );


  const avgSleep =
    average(sleepValues);


  function averageForLoad(
    field,
    value

    return average(
      recent
        .filter(
          x => x[field] === value

        .map(
          x => x.laterSleepiness

    averageForLoad(

/* =========================
   バックアップ
========================= */

function backupData() {

  const backup = {

    app:
      'Sleep Log',

    schemaVersion:
      SCHEMA_VERSION,

    exportedAt:
      new Date().toISOString(),

    data:
      db

  };


  const json =
    JSON.stringify(
      backup,
      null,
      2
    );


  const blob =
    new Blob(
      [json],
      {
        type:
          'application/json'
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const date =
    new Date()
      .toISOString()
      .slice(0, 10);


  const filename =
    `sleep-log-backup-${date}.json`;


  /*
    iPhoneなどで共有機能が使える場合
  */

  if (
    navigator.share &&
    navigator.canShare
  ) {

    const file =
      new File(
        [blob],
        filename,
        {
          type:
            'application/json'
        }
      );


    if (
      navigator.canShare({
        files: [file]
      })
    ) {

      navigator.share({
        title:
          'Sleep Log バックアップ',

        text:
          'Sleep Logのバックアップ',

        files:
          [file]

      })
      .then(
        () => {
          URL.revokeObjectURL(url);
        }
      )
      .catch(
        () => {
          URL.revokeObjectURL(url);
        }
      );

      return;
    }

  }


  /*
    共有機能が使えない場合
  */

  const a =
    document.createElement(
      'a'
    );

  a.href = url;

  a.download =
    filename;

  document.body.appendChild(
    a
  );

  a.click();

  a.remove();

  setTimeout(
    () =>
      URL.revokeObjectURL(url),
    1000
  );


  alert(
    'バックアップファイルを作成しました。'
  );

}


/* =========================
   バックアップ復元
========================= */

function restoreData(file) {

  if (!file) return;


  const reader =
    new FileReader();


  reader.onload =
    function(event) {

      try {

        const backup =
          JSON.parse(
            event.target.result
          );


        /*
          バックアップ形式確認
        */

        if (
          !backup ||
          backup.app !==
            'Sleep Log' ||
          !backup.data
        ) {

          alert(
            'このファイルはSleep Logのバックアップとして認識できません。'
          );

          return;
        }


        const restored =
          backup.data;


        /*
          配列がない場合も安全に補う
        */

        if (
          !Array.isArray(
            restored.diary
          )
        ) {
          restored.diary = [];
        }


        if (
          !Array.isArray(
            restored.sleep
          )
        ) {
          restored.sleep = [];
        }


        if (
          !Array.isArray(
            restored.morning
          )
        ) {
          restored.morning = [];
        }


        if (
          !Array.isArray(
            restored.day
          )
        ) {
          restored.day = [];
        }


        /*
          復元前確認
        */

        const ok =
          confirm(
            `このバックアップを復元しますか？\n\n` +
            `睡眠記録：${restored.diary.length}件\n\n` +
            `現在のデータは上書きされます。`
          );


        if (!ok) {
          return;
        }


        /*
          現在のデータを自動退避
        */

        backupBeforeChange();


        /*
          復元
        */

        db =
          restored;


        saveDB();

        resetForm();

        render();


        alert(
          'バックアップから復元しました。'
        );


      } catch (error) {

        alert(
          'バックアップファイルを読み込めませんでした。'
        );

      }

    };


  reader.readAsText(
    file
  );

}


/* =========================
   イベント
========================= */

$('tabLog').addEventListener(
  'click',
  () =>
    activateTab(
      'log',
      'tabLog'
    )
);


$('tabHistory').addEventListener(
  'click',
  () =>
    activateTab(
      'history',
      'tabHistory'
    )
);


$('tabAnalysis').addEventListener(
  'click',
  () =>
    activateTab(
      'analysis',
      'tabAnalysis'
    )
);


$('saveDiaryBtn').addEventListener(
  'click',
  addSleepDiary
);


$('cancelEditBtn').addEventListener(
  'click',
  resetForm
);


/* =========================
   バックアップボタン
========================= */

$('backupBtn').addEventListener(
  'click',
  backupData
);


$('restoreBtn').addEventListener(
  'click',
  () => {

    $('restoreFile').click();

  }
);


$('restoreFile').addEventListener(
  'change',
  event => {

    const file =
      event.target.files[0];

    restoreData(file);

    /*
      同じファイルをもう一度選べるようにする
    */

    event.target.value = '';

  }
);


/* =========================
   全データ削除
========================= */

$('clearAllBtn').addEventListener(
  'click',
  () => {

    const ok =
      confirm(
        'すべての睡眠記録を削除しますか？\n\n' +
        '削除前のデータは自動バックアップされます。'
      );


    if (!ok) return;


    /*
      削除前に自動バックアップ
    */

    backupBeforeChange();


    db =
      createEmptyDB();


    saveDB();

    resetForm();

    render();

  }
);


/* =========================
   履歴の編集・削除
========================= */

$('historyList').addEventListener(
  'click',
  event => {

    const editButton =
      event.target.closest(
        '[data-edit-id]'
      );


    if (editButton) {

      editDiary(
        editButton.dataset.editId
      );

      return;

    }


    const deleteButton =
      event.target.closest(
        '[data-delete-id]'
      );


    if (deleteButton) {

      deleteDiary(
        deleteButton.dataset.deleteId
      );

    }

  }
);


/* =========================
   初期化
========================= */

render();

</script>

</body>
</html>
